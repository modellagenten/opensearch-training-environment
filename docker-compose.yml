name: "modellagenten"
services:
  opensearch-node1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opensearch-node1
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2
      - bootstrap.memory_lock=true  # along with the memlock settings below, disables swapping
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g  # minimum and maximum Java heap size, recommend setting both to 50% of system RAM
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}    # Sets the demo admin user password when using demo configuration, required for OpenSearch 2.12 and higher
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536  # maximum number of open files for the OpenSearch user, set to at least 65536 on modern systems
        hard: 65536
    volumes:
      - opensearch-data1:/usr/share/opensearch/data
    ports:
      - 9200:9200
      - 9600:9600  # required for Performance Analyzer
    networks:
      - opensearch-net
  opensearch-node2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opensearch-node2
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node2
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data2:/usr/share/opensearch/data
    networks:
      - opensearch-net
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.8.0
    container_name: opensearch-dashboards
    ports:
      - 5601:5601
    expose:
      - '5601'
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch-node1:9200","https://opensearch-node2:9200"]'
    networks:
      - opensearch-net

  opensearch-init:
    image: alpine/curl:8.21.0
    container_name: opensearch-init
    depends_on:
      - opensearch-node1
      - opensearch-node2
    environment:
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
    volumes:
      - ./data/load-data.sh:/load-data.sh:ro
      - ./data/apache_logs:/data/apache_logs:ro
      - ./data/gfu-bulk-endpoint.jsonl:/data/gfu-bulk-endpoint.jsonl:ro
    entrypoint: ["/bin/sh", "-c", "sed 's/\\r$//' /load-data.sh > /tmp/load-data.sh && sh /tmp/load-data.sh"]
    networks:
      - opensearch-net

  logstash:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
    container_name: logstash
    depends_on:
      - opensearch-node1
      - opensearch-node2
    environment:
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ./data/logstash/pipeline/:/usr/share/logstash/pipeline/:ro
      - ./data/logstash/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
    ports:
      - 5044:5044
    networks:
      - opensearch-net

  prometheus:
    image: prom/prometheus:v3.13.0
    container_name: prometheus
    volumes:
      - ./data/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - 9090:9090
    networks:
      - opensearch-net
  
  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: grafana
    ports:
      - 3000:3000
    volumes:
      - ./data/dashboard.yaml:/etc/grafana/provisioning/dashboards/main.yaml
      - ./data/dashboards:/var/lib/grafana/dashboards
      - ./data/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
    networks:
      - opensearch-net


volumes:
  opensearch-data1:
  opensearch-data2:

networks:
  opensearch-net: