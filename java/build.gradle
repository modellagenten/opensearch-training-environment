plugins {
    id 'java'
    id 'application'
}

group = 'com.example'
version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Elasticsearch Java Client - Version für Elasticsearch 9.1.4
    implementation 'co.elastic.clients:elasticsearch-java:9.1.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'jakarta.json:jakarta.json-api:2.1.3'
    implementation 'org.eclipse.parsson:parsson:1.1.6'
    
    // OpenSearch Java Client - Aktuelle Version (3.x)
    implementation 'org.opensearch.client:opensearch-java:3.0.0'
    
    // HTTP Client für beide Clients
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.2.1'
    implementation 'org.apache.httpcomponents.core5:httpcore5:5.3.5'
    
    // Environment Variables
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'
    
    // Logging
    implementation 'org.slf4j:slf4j-simple:2.0.13'
    
    // JSON Processing
    implementation 'com.fasterxml.jackson.core:jackson-core:2.18.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.18.2'
}

application {
    mainClass = 'com.example.ElasticsearchConnectionTest'
    //mainClass = 'com.example.OpenSearchConnectionTest'
}
